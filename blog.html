<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog | Jabulile Monnakgotla</title>
<style>
@font-face{font-family:Schola;src:url(fonts/schola-regular.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Schola;src:url(fonts/schola-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:Schola;src:url(fonts/schola-bold.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{--ink:#000;--muted:#000;--line:#DDDDDD;--accent:#000;--bg:#FFFFFF}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Schola,"Century Schoolbook",Century,Georgia,serif;-webkit-font-smoothing:antialiased}

a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:#000;text-decoration-thickness:2px}
header{display:grid;grid-template-columns:1fr 200px;gap:32px;align-items:start}
h1{font:700 2.5rem/1.15 Schola,"Century Schoolbook",Georgia,serif;margin:0 0 10px;letter-spacing:-.01em}
.title{font-size:1.15rem;font-weight:700;margin:0}
.inst{font-size:1rem;color:var(--muted);margin:2px 0 0}
.email{margin:8px 0 0;font-size:.98rem}
.profiles{margin:14px 0 0;font-size:.92rem;color:var(--muted)}
.profiles a{margin-right:2px}
ul.nav{margin:20px 0 0;padding-left:20px;font-size:.98rem}
ul.nav li{margin:2px 0}
.photo{width:200px;height:200px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
@media(max-width:640px){header{grid-template-columns:1fr}.photo{order:-1;width:150px;height:150px}h1{font-size:2.1rem}}
h2{font:700 1.3rem/1.3 Schola,"Century Schoolbook",Georgia,serif;margin:48px 0 14px;padding-top:20px;border-top:1px solid var(--line)}
p{margin:0 0 14px;text-align:justify}
ul.feed li,dd,.inst{text-align:justify}
.year{font-weight:700;color:var(--accent);margin:26px 0 6px;font-size:1rem}
ul.feed{list-style:none;margin:0;padding:0}
ul.feed li{padding:8px 0;border-bottom:1px solid #EEEEEE}

.kind{display:inline-block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.by{display:block;font-size:.88rem;color:var(--muted)}
.me{color:var(--ink);font-weight:700}
dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:6px 16px;font-size:.96rem}
dt{color:var(--muted)}
dd{margin:0}
@media(max-width:560px){dl{grid-template-columns:1fr}dt{margin-top:8px}}
footer{margin-top:56px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
.layout{display:grid;grid-template-columns:240px minmax(0,860px);justify-content:center;min-height:100vh;background:linear-gradient(to right,#EFEFEF max(240px,calc(50% - 310px)),#FFFFFF max(240px,calc(50% - 310px)))}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:52px 20px 24px 24px}
.sname{display:block;font-weight:700;font-size:1.05rem;text-decoration:none;margin-bottom:18px;line-height:1.3}
.side ul{list-style:none;margin:0;padding:0}
.side li{margin:0 0 9px}
.side a{text-decoration:none}
.side li a:hover{text-decoration:underline}
main{max-width:860px;width:100%;margin:0;padding:48px 48px 64px}
@media(max-width:860px){
 .layout{display:block;background:none}
 .side{position:static;height:auto;padding:16px 20px 12px;background:#EFEFEF}
 .sname{margin-bottom:8px}
 .side ul{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.92rem}
 .side li{margin:0}
 .side li a{text-decoration:underline}
 main{padding:28px 24px 64px}
}
</style>
</head>
<body>

  <nav><ul>

      <li><a href="index.html#publications">Publications</a></li>
      <li><a href="index.html#working-papers">Working papers</a></li>
      <li><a href="index.html#reports">Research reports</a></li>
      <li><a href="index.html#briefs">Fact sheets and briefs</a></li>
      <li><a href="index.html#presentations">Presentations</a></li>
      <li><a href="index.html#background">Positions and education</a></li>
      <li><a href="blog.html">Blog</a></li>
  </ul></nav>
</aside>
<main>

<footer>© 2026 Jabulile Monnakgotla</footer>
</main>
</div>
</body>
</html>
